
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y-META Calls</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f1f4f9;
  padding: 20px;
}
.container {
  max-width: 850px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
input, button {
  padding: 12px;
  margin: 8px;
  width: 90%;
  max-width: 400px;
}
button {
  background: #1769ff;
  color: white;
  border: none;
  cursor: pointer;
}
.videos {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
video {
  width: 100%;
  max-width: 390px;
  background: black;
}
</style>
</head>
<body>

<div class="container">
<h1>Y-META Calls</h1>

<input id="userName" placeholder="Your name">

<button id="register">Connect to Y-META Calls</button>

<p>Your user ID: <strong id="myId">Not connected</strong></p>

<input id="targetId" placeholder="Enter receiver's user ID">

<button id="call">Call</button>
<button id="end">End Call</button>

<p id="status">Ready.</p>

<div class="videos">
  <div>
    <h3>Your Camera</h3>
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div>
    <h3>Other Person</h3>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
