<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y-META Video Call</title>
  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font-family: Arial, sans-serif;
    }

    input, button {
      display: block;
      width: 100%;
      max-width: 460px;
      box-sizing: border-box;
      margin: 12px 0;
      padding: 12px;
      font-size: 16px;
    }

    button { cursor: pointer; }

    #status { overflow-wrap: anywhere; }

    #meeting {
      width: 100%;
      height: 600px;
      margin-top: 16px;
      background: #111;
    }
  </style>
</head>
<body>
  <h1>Y-META Video Call</h1>
  <p>
    Start a call and share its invitation link. The other person can join
    in their browser without installing Y-META.
  </p>

  <label>
    Your name
    <input id="name" placeholder="Enter your name">
  </label>

  <label>
    Invite by phone (optional)
    <input id="phone" type="tel" placeholder="+2507XXXXXXXX">
  </label>

  <button id="callButton" type="button">Start video call</button>
  <button id="inviteButton" type="button" disabled>Share invitation</button>

  <p id="status" role="status">Ready.</p>
  <div id="meeting"></div>

  <script>
    const APP_URL = "https://yves0988.github.io/y-meta/";
    const statusText = document.getElementById("status");
    const callButton = document.getElementById("callButton");
    const inviteButton = document.getElementById("inviteButton");
    const meetingContainer = document.getElementById("meeting");

    let room = new URLSearchParams(location.search).get("call");
    let meeting = null;

    function createCallId() {
      const id = crypto.randomUUID
        ? crypto.randomUUID().replace(/-/g, "")
        : Math.random().toString(36).slice(2) + Date.now().toString(36);

      return "YMETA-" + id;
    }

    function getInviteLink() {
      const url = new URL(APP_URL);
      url.searchParams.set("call", room);
      return url.href;
    }

    function loadJitsi() {
      return new Promise((resolve, reject) => {
        if (window.JitsiMeetExternalAPI) return resolve();

        const script = document.createElement("script");
        script.src = "https://meet.jit.si/external_api.js";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Could not load the video-call service."));
        document.head.appendChild(script);
      });
    }

    callButton.addEventListener("click", async () => {
      if (meeting) return;

      if (!room) {
        room = createCallId();
        history.replaceState({}, "", getInviteLink());
      }

      callButton.disabled = true;
      statusText.textContent = "Connecting. Allow camera and microphone when asked.";

      try {
        await loadJitsi();

        meeting = new JitsiMeetExternalAPI("meet.jit.si", {
          roomName: room,
          parentNode: meetingContainer,
          width: "100%",
          height: "100%",
          userInfo: {
            displayName: document.getElementById("name").value.trim() || "Y-META user"
          }
        });

        meeting.addEventListener("videoConferenceJoined", () => {
          statusText.textContent = "You joined. Share the invitation with the other person.";
          inviteButton.disabled = false;
          callButton.textContent = "Call in progress";
        });

        meeting.addEventListener("videoConferenceLeft", () => {
          meeting = null;
          meetingContainer.replaceChildren();
          callButton.disabled = false;
          callButton.textContent = "Join video call";
          statusText.textContent = "You left the call.";
        });
      } catch (error) {
        console.error(error);
        meeting = null;
        callButton.disabled = false;
        statusText.textContent = error.message || "Could not start the call.";
      }
    });

    inviteButton.addEventListener("click", async () => {
      if (!room) return;

      const link = getInviteLink();
      const phone = document.getElementById("phone").value.trim();

      // On a phone, this opens the SMS app with the invitation filled in.
      if (phone && /^\+[1-9]\d{7,14}$/.test(phone)) {
        const message = `Join my Y-META video call: ${link}`;
        location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
        return;
      }

      // Otherwise use the device's share sheet, or copy the link.
      try {
        if (navigator.share) {
          await navigator.share({
            title: "Y-META video call",
            text: "Join my video call:",
            url: link
          });
        } else {
          await navigator.clipboard.writeText(link);
          statusText.textContent = "Invitation link copied. Send it to the other person.";
        }
      } catch (error) {
        statusText.textContent = `Copy/share this invitation link: ${link}`;
      }
    });

    if (room) {
      callButton.textContent = "Join video call";
      inviteButton.disabled = false;
      statusText.textContent =
        "You were invited. Tap Join video call and allow camera/microphone.";
    }
  </script>
</body>
</html>
