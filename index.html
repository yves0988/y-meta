
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Y-META Video Call</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 25px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    h1 {
      color: #1769ff;
    }

    input, button {
      width: 100%;
      max-width: 450px;
      padding: 13px;
      margin: 10px auto;
      display: block;
      box-sizing: border-box;
      font-size: 16px;
      border-radius: 7px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #1769ff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #inviteButton {
      background: #159447;
    }

    #status {
      margin: 20px;
      overflow-wrap: anywhere;
    }

    #meeting {
      width: 100%;
      height: 600px;
      background: #111;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Y-META Video Call</h1>

  <p>Connect with people through video and audio calls.</p>

  <input
    type="text"
    id="userName"
    placeholder="Enter your name"
  >

  <button id="callButton">
    Start Video Call
  </button>

  <button id="inviteButton" disabled>
    Invite Someone
  </button>

  <p id="status">Ready to make a call.</p>

  <div id="meeting"></div>

</div>

<script>
  const APP_URL = "https://yves0988.github.io/y-meta/";

  const nameInput = document.getElementById("userName");
  const callButton = document.getElementById("callButton");
  const inviteButton = document.getElementById("inviteButton");
  const statusText = document.getElementById("status");
  const meetingContainer = document.getElementById("meeting");

  let room = new URLSearchParams(location.search).get("call");
  let meeting = null;

  function createRoom() {
    return "YMETA-" + crypto.randomUUID().replace(/-/g, "");
  }

  function getInviteLink() {
    const url = new URL(APP_URL);
    url.searchParams.set("call", room);
    return url.href;
  }

  function loadJitsi() {
    return new Promise((resolve, reject) => {

      if (window.JitsiMeetExternalAPI) {
        resolve();
        return;
      }

      const script = document.createElement("script");

      script.src = "https://meet.jit.si/external_api.js";

      script.onload = resolve;

      script.onerror = () => {
        reject(new Error("Video call service failed to load."));
      };

      document.head.appendChild(script);
    });
  }

  callButton.addEventListener("click", async () => {

    if (meeting) return;

    if (!room) {
      room = createRoom();

      const url = new URL(location.href);
      url.searchParams.set("call", room);

      history.replaceState({}, "", url.href);
    }

    callButton.disabled = true;
    statusText.textContent = "Connecting to video call...";

    try {

      await loadJitsi();

      meeting = new JitsiMeetExternalAPI("meet.jit.si", {

        roomName: room,

        parentNode: meetingContainer,

        width: "100%",

        height: "100%",

        userInfo: {
          displayName: nameInput.value.trim() || "Y-META User"
        },

        configOverwrite: {
          prejoinPageEnabled: true
        },

        interfaceConfigOverwrite: {
          SHOW_JITSI_WATERMARK: false
        }

      });

      meeting.addEventListener("videoConferenceJoined", () => {

        statusText.textContent =
          "Connected! You can now talk and see the other person.";

        callButton.textContent = "Call in progress";

        inviteButton.disabled = false;

      });

      meeting.addEventListener("videoConferenceLeft", () => {

        meeting = null;

        meetingContainer.replaceChildren();

        callButton.disabled = false;

        callButton.textContent = "Start Video Call";

        inviteButton.disabled = true;

        statusText.textContent = "You left the call.";

      });

      meeting.addEventListener("readyToClose", () => {

        meeting = null;

        meetingContainer.replaceChildren();

        callButton.disabled = false;

        callButton.textContent = "Start Video Call";

        inviteButton.disabled = true;

        statusText.textContent = "Call ended.";

      });

    } catch (error) {

      console.error(error);

      meeting = null;

      callButton.disabled = false;

      statusText.textContent =
        "Could not connect. Check your internet and try again.";

    }

  });

  inviteButton.addEventListener("click", async () => {

    if (!room) return;

    const link = getInviteLink();

    try {

      if (navigator.share) {

        await navigator.share({
          title: "Y-META Video Call",
          text: "Join my Y-META video call:",
          url: link
        });

      } else {

        await navigator.clipboard.writeText(link);

        statusText.textContent =
          "Invitation link copied. Send it to your friend.";

      }

    } catch (error) {

      try {

        await navigator.clipboard.writeText(link);

        statusText.textContent = "Invitation link copied.";

      } catch {

        statusText.textContent = "Your invitation link: " + link;

      }

    }

  });

  if (room) {

    callButton.textContent = "Join Video Call";

    statusText.textContent =
      "You have received an invitation. Click Join Video Call.";

  }

</script>

</body>
</html>
