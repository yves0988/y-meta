<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hamagara kuri Y-META</title>
</head>
<body>
  <h1>Hamagara kuri Y-META</h1>

  <label for="phoneNumber">Nimero ya telefone</label>
  <input
    id="phoneNumber"
    type="tel"
    placeholder="+2507XXXXXXXX"
    autocomplete="tel"
  >

  <button id="callButton" type="button">Hamagara</button>
  <p id="status" role="status"></p>

  <script>
    const phoneInput = document.getElementById("phoneNumber");
    const status = document.getElementById("status");

    document.getElementById("callButton").addEventListener("click", () => {
      const number = phoneInput.value.trim();

      // Andika nimero mu buryo mpuzamahanga, urugero +2507XXXXXXXX.
      if (!/^\+[1-9]\d{7,14}$/.test(number)) {
        status.textContent =
          "Andika nimero yemewe, urugero +2507XXXXXXXX.";
        return;
      }

      status.textContent =
        "Telefone irafungura dialer. Emeza call kuri telefone yawe.";

      window.location.href = `tel:${number}`;
    });
  </script>
</body>
</html>
