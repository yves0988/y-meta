
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Y-META Video Calls</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>Y-META</h1>
    <h2>Video Calling</h2>

    <section id="loginSection">

      <input
        id="userName"
        type="text"
        placeholder="Enter your name"
        maxlength="30"
      >

      <button id="connectButton">
        Connect
      </button>

    </section>

    <section id="callSection" hidden>

      <p>
        Your ID:
        <strong id="myId">Connecting...</strong>
      </p>

      <h3>People Online</h3>

      <div id="usersList">
        No users online.
      </div>

      <section id="incomingCall" hidden>

        <h3 id="callerName">Incoming call</h3>

        <button id="acceptButton">
          Accept
        </button>

        <button id="rejectButton" class="danger">
          Reject
        </button>

      </section>

      <h3>Video Call</h3>

      <div class="videos">

        <div class="videoBox">
          <p>You</p>
          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>
        </div>

        <div class="videoBox">
          <p>Other Person</p>
          <video
            id="remoteVideo"
            autoplay
            playsinline
          ></video>
        </div>

      </div>

      <button id="endButton" class="danger" disabled>
        End Call
      </button>

    </section>

    <p id="status">Ready.</p>

  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

</body>
</html>
