<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Y-META Call Room</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    input, button { display: block; margin: 10px 0; padding: 10px; }
    video { width: min(100%, 340px); background: #111; margin: 8px; }
    .videos { display: flex; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>Y-META Video Call</h1>
  <p>Room code ni code yo muri app, si nimero ya telefone.</p>

  <input id="userName" placeholder="Your name">
  <input id="roomCode" inputmode="numeric" placeholder="Room code, e.g. 482193">

  <button id="generateCode" type="button">Generate room code</button>
  <button id="joinCall" type="button">Join call</button>
  <button id="leaveCall" type="button" disabled>End call</button>

  <p id="status">Not connected.</p>

  <div class="videos">
    <div><p>You</p><video id="localVideo" autoplay muted playsinline></video></div>
    <div><p>Other person</p><video id="remoteVideo" autoplay playsinline></video></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
